services:
  backend:
    build: ./backend
    container_name: echecs-backend
    env_file: .env
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      MILVUS_URI: http://milvus:19530
    ports:
      - "${BACKEND_HOST_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - hf_models:/models
      - ./backend/data:/app/data
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.25
    container_name: echecs-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_HOST_PORT:-19530}:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_interval: 5s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: echecs-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      start_period: 30s
      start_interval: 5s
      timeout: 20s
      retries: 3

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: echecs-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      start_period: 30s
      start_interval: 5s
      timeout: 20s
      retries: 3

volumes:
  hf_models:
  milvus_data:
  etcd_data:
  minio_data:
